name: Release — Build & Publish APK

on:
  # Manual trigger — never runs automatically
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string
      release_branch:
        description: "Branch to build from (e.g. release/v1.0.0 or master)"
        required: true
        default: "master"
        type: string

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout the chosen release branch ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_branch }}
          fetch-depth: 0

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Set up Expo / EAS ─────────────────────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli@14

      # ── 6. Build APK ──────────────────────────────────────────────────────
      - name: Build APK via EAS (Local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: true
        run: |
          mkdir -p ./build
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build/RateFlip-${{ github.event.inputs.version }}.apk

      # ── 7. Rename APK if EAS ignored --output ─────────────────────────────
      # EAS sometimes ignores --output and drops app-release.apk in the root.
      # This step finds it wherever it landed and moves it to the expected path.
      - name: Ensure APK is correctly named
        run: |
          TARGET="./build/RateFlip-${{ github.event.inputs.version }}.apk"
          if [ ! -f "$TARGET" ]; then
            FOUND=$(find . -maxdepth 2 -type f -name "*.apk" -print -quit)
            if [ -z "$FOUND" ]; then
              echo "Error: Expected an APK from EAS, but none was found." >&2
              exit 1
            fi
            echo "EAS ignored --output. Found APK at: $FOUND"
            mv "$FOUND" "$TARGET"
          fi

      # ── 8. Create GitHub Release and upload APK ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: ./build/RateFlip-${{ github.event.inputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
