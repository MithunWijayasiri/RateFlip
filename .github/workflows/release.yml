name: Release — Build & Publish APK

on:
  # ✋ Manual trigger ONLY — never runs automatically
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
      release_branch:
        description: 'Branch to build from (e.g. release/v1.0.0 or master)'
        required: true
        default: 'master'
        type: string
      release_notes:
        description: 'Release notes (e.g. Initial release)'
        required: false
        default: 'Automated build'
        type: string

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the chosen release branch ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_branch }}
          fetch-depth: 0

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci



      # ── 4. Set up Expo / EAS ─────────────────────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --output ./build/app-release.apk

      # ── 5. Create GitHub Release and upload APK ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Release ${{ github.event.inputs.version }}"
          body: |
            ## RateFlip ${{ github.event.inputs.version }}
            
            ${{ github.event.inputs.release_notes }}
            
            ---
            **Build Details**
            - Branch: `${{ github.event.inputs.release_branch }}`
          files: ./build/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
